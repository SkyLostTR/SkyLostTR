name: Deepcore Miner Android

on:
  push:
    branches:
      - build/deepcore-miner-android
    paths:
      - 'deepcore-miner/**'
      - '.github/workflows/deepcore-miner-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'deepcore-miner/**'
      - '.github/workflows/deepcore-miner-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deepcore-miner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Assemble gameplay script
        run: |
          cat scripts/main.part00 scripts/main.part01 scripts/main.part02 scripts/main.part03 > scripts/main.gd
          test -s scripts/main.gd

      - name: Render branded PNG boot splash
        run: |
          python3 <<'PY'
          import math, struct, zlib
          from pathlib import Path

          w, h = 540, 960
          cx, cy = 270, 395
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  dx, dy = x-cx, y-cy
                  d = math.sqrt((dx/1.0)**2 + (dy/1.05)**2)
                  glow = max(0.0, 1.0-d/330.0)
                  vertical = y / h
                  r = int(4 + 18*glow + 2*(1-vertical))
                  g = int(7 + 32*glow + 4*(1-vertical))
                  b = int(16 + 55*glow + 7*(1-vertical))
                  diamond = abs(dx)/118.0 + abs(dy)/230.0
                  if diamond <= 1.0:
                      edge = max(0.0, min(1.0, (1.0-diamond)*5.0))
                      side = max(0.0, min(1.0, (dx+118)/236.0))
                      r = int(65 + 75*side + 40*edge)
                      g = int(150 + 80*(1-side) + 25*edge)
                      b = int(235 + 20*edge)
                  elif diamond <= 1.075:
                      r, g, b = 188, 248, 255
                  if diamond < 0.96 and (abs(dx) < 2 or abs(dy) < 2):
                      r, g, b = 225, 255, 255
                  if 625 <= y <= 638 and 110 <= x <= 430:
                      r, g, b = 255, 181, 66
                  for px in (180, 270, 360):
                      if (x-px)*(x-px) + (y-700)*(y-700) <= 25:
                          r, g, b = 92, 226, 255
                  row += bytes((max(0,min(255,r)), max(0,min(255,g)), max(0,min(255,b))))
              rows.append(bytes(row))

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          raw = b''.join(rows)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          Path('assets/splash.png').write_bytes(png)
          print('Rendered assets/splash.png', len(png), 'bytes')
          PY
          test -s assets/splash.png

      - name: Create prototype online leaderboard
        id: leaderboard
        shell: bash
        run: |
          cat > /tmp/leaderboard.json <<'JSON'
          {"entries":[{"id":"seed-rockhound","name":"RockHound","score":12500,"depth":38,"updated":0},{"id":"seed-crystalfox","name":"CrystalFox","score":7400,"depth":27,"updated":0},{"id":"seed-tunnelrat","name":"TunnelRat","score":3150,"depth":18,"updated":0}]}
          JSON
          DEMO_API_KEY='8969a471-87b7-4758-9f34-b090d396d9bb'
          response=$(curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/leaderboard.json \
            "https://api.jsonstorage.net/v1/json?apiKey=${DEMO_API_KEY}&name=deepcore-miner-${GITHUB_RUN_ID}")
          base_url=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["uri"])')
          if [ -z "$base_url" ]; then
            echo 'Leaderboard creation did not return a URI' >&2
            echo "$response" >&2
            exit 1
          fi
          url="${base_url}?apiKey=${DEMO_API_KEY}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > leaderboard-url.txt
          python3 - "$url" <<'PY'
          from pathlib import Path
          import sys
          p=Path('scripts/main.gd')
          s=p.read_text()
          s=s.replace('__LEADERBOARD_URL__', sys.argv[1])
          p.write_text(s)
          PY

      - name: Configure Android export
        shell: bash
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname 'CN=Android Debug,O=Android,C=US' -validity 10000 -keysize 2048
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          godot --version

      - name: Import project and validate scripts
        run: |
          rm -rf .godot/imported
          timeout 180 godot --headless --path . --import --quit

      - name: Smoke launch main scene
        run: |
          set +e
          timeout 20 godot --headless --path . --rendering-method gl_compatibility --quit-after 8 > /tmp/deepcore-smoke.log 2>&1
          rc=$?
          set -e
          cat /tmp/deepcore-smoke.log
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          if grep -Eiq 'SCRIPT ERROR|Invalid assignment|Invalid call|Attempt to call|Cannot call method|Parse Error' /tmp/deepcore-smoke.log; then
            echo 'Runtime smoke test found a game error.' >&2
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/deepcore-miner.apk
          test -s build/deepcore-miner.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/deepcore-miner.apk | head -30

      - name: Package source snapshot
        run: |
          rm -rf package-source
          mkdir -p package-source
          cp -a project.godot Main.tscn export_presets.cfg default_bus_layout.tres assets scripts README.md leaderboard-url.txt package-source/
          rm -f package-source/scripts/main.part00 package-source/scripts/main.part01 package-source/scripts/main.part02 package-source/scripts/main.part03
          (cd package-source && zip -qr ../build/deepcore-miner-source.zip .)

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: deepcore-miner-android
          path: |
            deepcore-miner/build/deepcore-miner.apk
            deepcore-miner/build/deepcore-miner-source.zip
            deepcore-miner/leaderboard-url.txt
          retention-days: 7
          if-no-files-found: error
